name: Build & Publish Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Create placeholder .env if not present
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Decode Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Build Release App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Prepare Release Artifacts
        id: prepare_bundle
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          if [ -z "$VERSION_TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TAG="${{ github.event.inputs.tag_name }}"
          fi
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v1.0.0"
          fi
          
          mkdir -p release_bundles
          AAB_PATH=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_PATH" ] && [ -f "$AAB_PATH" ]; then
            echo "Found AAB at $AAB_PATH"
            cp "$AAB_PATH" "release_bundles/VocabReels-${VERSION_TAG}.aab"
          else
            echo "Error: Release AAB bundle not found in app/build/outputs/bundle/release"
            exit 1
          fi
          echo "tag_name=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Upload AAB to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VocabReels-${{ steps.prepare_bundle.outputs.tag_name }}-aab
          path: release_bundles/VocabReels-${{ steps.prepare_bundle.outputs.tag_name }}.aab

      - name: Create GitHub Release & Upload AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: VocabReels ${{ steps.prepare_bundle.outputs.tag_name }}
          tag_name: ${{ steps.prepare_bundle.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_bundles/VocabReels-${{ steps.prepare_bundle.outputs.tag_name }}.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean Up Keystore
        if: always()
        run: rm -f app/release.jks
